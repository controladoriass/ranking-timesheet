<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Ranking de Evolução · Timesheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#16324f; --navy2:#1d3e5e; --ink:#16324f; --ink2:#5b7488; --ink3:#93a6b6;
  --gold:#c9a227; --gold2:#b8931f;
  --bg:#f4f6f8; --bg2:#eef1f4; --card:#ffffff; --line:#e3e8ee; --line2:#eef2f6;
  --up:#2e9e6b; --up2:#1f8a5a; --down:#d15757; --down2:#b84545; --flat:#8798a6;
  --shadow:0 30px 70px rgba(22,50,79,.16); --shadow-side:0 14px 34px rgba(22,50,79,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:linear-gradient(180deg,#f7f9fb 0%, var(--bg) 100%) fixed;color:var(--ink);font-family:'Montserrat',system-ui,Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
.stage{flex:1;display:flex;flex-direction:column;width:100%;max-width:1280px;margin:0 auto;padding:clamp(20px,3vw,40px) clamp(14px,2.5vw,30px)}

/* header estilo foto */
.pagehead{text-align:center;margin-bottom:6px}
.pagehead .n{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;color:var(--gold);font-weight:800;font-size:12px;margin-bottom:8px}
.pagehead .eyebrow{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px}
.pagehead h1{font-size:clamp(26px,4vw,40px);font-weight:800;letter-spacing:-.015em;color:var(--navy)}
.pagehead .rule{width:120px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:16px auto 0}

/* carousel com laterais espiando */
.carousel{position:relative;flex:1;display:flex;align-items:center;justify-content:center;margin-top:22px}
.arw{flex:0 0 auto;width:48px;height:48px;border-radius:12px;background:var(--navy);border:0;color:#fff;font-size:22px;cursor:pointer;display:grid;place-items:center;transition:.18s;box-shadow:0 8px 20px rgba(22,50,79,.22);z-index:5}
.arw:hover{background:#0f2439;transform:translateY(-1px)}
.arw:disabled{opacity:.3;cursor:default}
.viewport{flex:1;overflow:hidden;padding:22px clamp(10px,4vw,60px)}
.track{display:flex;align-items:stretch;transition:transform .5s cubic-bezier(.5,.05,.2,1)}
.slide{flex:0 0 100%;padding:0 14px;display:flex;transition:.5s;opacity:1}
.slide.side{opacity:.42;filter:saturate(.7)}
.slide .card{width:100%}

.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;min-height:520px}
.slide.side .card{box-shadow:var(--shadow-side);transform:scale(.94)}
.card-h{padding:26px 30px 18px}
.card-h .eyebrow{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:8px}
.card-h h2{font-size:clamp(19px,2.4vw,26px);font-weight:800;letter-spacing:-.01em;color:var(--navy);line-height:1.1}
.card-h .desc{color:var(--ink3);font-size:12px;margin-top:8px;font-weight:500;line-height:1.5}
.card-b{padding:6px 22px 26px;overflow-y:auto;flex:1}

/* sector rows */
.slist{display:flex;flex-direction:column}
.srow{display:grid;grid-template-columns:34px 1fr 130px 92px;align-items:center;gap:16px;padding:15px 12px;border-bottom:1px solid var(--line2);cursor:pointer;transition:.14s;border-radius:10px}
.srow:last-child{border-bottom:0}
.srow:hover{background:var(--bg2)}
.srow .pos{font-weight:800;font-size:16px;color:var(--ink3);text-align:center}
.srow.r1 .pos{color:var(--gold)} .srow.r2 .pos{color:#b7a24f} .srow.r3 .pos{color:#c2b06b}
.srow .sinfo .sname{font-weight:700;font-size:15.5px;color:var(--navy)}
.srow .sinfo .ssub{font-size:11.5px;color:var(--ink3);margin-top:3px;font-weight:500}
.srow .track2{height:7px;background:var(--bg2);border-radius:5px;overflow:hidden}
.srow .track2 i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--gold2),var(--gold))}
.srow.down .track2 i{background:linear-gradient(90deg,#c96b6b,#d15757)}
.srow .evo{text-align:right;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.srow .evo small{font-size:9.5px;font-weight:600;color:var(--ink3);display:block;margin-top:1px;letter-spacing:.02em}
.srow .evo.up{color:var(--up)} .srow .evo.down{color:var(--down)} .srow .evo.flat{color:var(--flat)}
.srow .estreia{font-size:10px;font-weight:700;color:var(--gold2);background:rgba(201,162,39,.1);border:1px solid rgba(201,162,39,.3);border-radius:20px;padding:3px 10px;display:inline-block}

/* people drawer */
.back{margin:2px 0 16px;background:#fff;border:1px solid var(--line);color:var(--ink2);font-family:inherit;font-weight:600;font-size:12px;padding:8px 14px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.15s}
.back:hover{border-color:var(--gold);color:var(--navy)}
.phead{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);font-weight:700;margin:4px 0 12px 2px}
.prow{display:grid;grid-template-columns:28px 1fr auto auto;align-items:center;gap:12px;padding:11px 12px;border-bottom:1px solid var(--line2)}
.prow:last-child{border-bottom:0}
.prow .ppos{font-weight:800;color:var(--ink3);font-size:13px;text-align:center}
.prow .pname{font-weight:600;font-size:13.5px;color:var(--navy)}
.prow .pname small{display:block;color:var(--ink3);font-weight:500;font-size:11px;margin-top:1px}
.prow .ppct{font-size:12px;color:var(--ink2);font-weight:500;white-space:nowrap}
.prow .ppct .a{color:var(--ink3)} .prow .ppct b{color:var(--navy);font-weight:700}
.prow .pevo{min-width:60px;text-align:right;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.prow .pevo.up{color:var(--up)} .prow .pevo.down{color:var(--down)} .prow .pevo.flat{color:var(--flat)}

/* champion card */
.champ{display:flex;flex-direction:column;align-items:center;text-align:center;padding:18px 20px 30px;gap:18px}
.champ .crown{font-size:36px}
.champ .cname{font-size:clamp(26px,4.4vw,40px);font-weight:900;letter-spacing:-.02em;color:var(--navy);line-height:1.05}
.champ .cbig{font-size:clamp(42px,8vw,74px);font-weight:900;color:var(--up);font-variant-numeric:tabular-nums;line-height:1}
.champ .cbig small{font-size:.32em;color:var(--ink3);font-weight:700;letter-spacing:.05em}
.champ .cline{color:var(--ink2);font-size:14px;max-width:460px;line-height:1.65;font-weight:500}
.champ .cline b{color:var(--navy);font-weight:700}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:580px;margin-top:8px}
.pod{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:16px 12px;display:flex;flex-direction:column;gap:6px}
.pod .medal{font-size:22px}
.pod .pn{font-weight:700;font-size:13px;color:var(--navy)}
.pod .pv{font-weight:800;font-size:17px;color:var(--up);font-variant-numeric:tabular-nums}
.pod .pa{font-size:10.5px;color:var(--ink3)}
.pod.first{border-color:var(--gold);box-shadow:0 10px 26px rgba(201,162,39,.16)}

/* dots */
.dots{display:flex;gap:9px;justify-content:center;margin-top:22px}
.dots .d{width:9px;height:9px;border-radius:50%;background:var(--line);cursor:pointer;transition:.16s;border:0}
.dots .d.on{background:var(--gold);width:26px;border-radius:6px}

@media(max-width:720px){
  .viewport{padding:14px 4px}
  .slide{flex-basis:100%;padding:0 6px}
  .arw{width:40px;height:40px;font-size:18px}
  .srow{grid-template-columns:30px 1fr 82px;gap:10px}
  .srow .track2{display:none}
  .prow{grid-template-columns:24px 1fr auto}
  .prow .ppct{display:none}
}
</style>
</head>
<body>
<div class="stage">

  <div class="pagehead">
    <div class="eyebrow">Destaque</div>
    <h1>Ranking de Evolução · Timesheet</h1>
    <div class="rule"></div>
  </div>

  <div class="carousel">
    <button class="arw" id="prev" aria-label="anterior">‹</button>
    <div class="viewport">
      <div class="track" id="track">

        <!-- SLIDE 1: setores -->
        <div class="slide">
          <div class="card">
            <div class="card-h">
              <div class="eyebrow">Por setor</div>
              <h2>Qual setor mais evoluiu</h2>
              <div class="desc">Crescimento do % da meta de julho até a data atual. Clique num setor para ver as pessoas.</div>
            </div>
            <div class="card-b" id="sectorBody"></div>
          </div>
        </div>

        <!-- SLIDE 2: campeão -->
        <div class="slide">
          <div class="card">
            <div class="card-h">
              <div class="eyebrow">Destaque</div>
              <h2>O setor que mais vem evoluindo</h2>
              <div class="desc">Maior crescimento no período · tendência de subida do timesheet.</div>
            </div>
            <div class="card-b"><div class="champ" id="champBody"></div></div>
          </div>
        </div>

      </div>
    </div>
    <button class="arw" id="next" aria-label="próximo">›</button>
  </div>

  <div class="dots" id="dots"></div>

</div>

<script src="dados.js"></script>
<script>
(function(){
  const D = window.TIMESHEET_DATA;
  const M1='Julho', M2='Setembro';

  const clsv = v => v>1 ? 'up' : (v<-1 ? 'down' : 'flat');
  const fmtVar = v => (v>0?'+':'')+Math.round(v)+'%';

  function sectorData(){
    let arr=[];
    for(const [nome,v] of Object.entries(D.setores)){
      if((v.Julho+v.Agosto+v.Setembro)===0) continue;
      const j=v[M1], s=v[M2];
      let varp=null, estreante=false;
      if(j>0.5) varp=(s-j)/j*100; else estreante=true;
      arr.push({nome,n:v.n,j,s,varp,estreante});
    }
    arr.sort((a,b)=>{
      if(a.estreante&&b.estreante) return b.s-a.s;
      if(a.estreante) return -1; if(b.estreante) return 1;
      return b.varp-a.varp;
    });
    return arr;
  }
  function peopleOf(area){
    let arr=Object.entries(D.colaboradores).filter(([n,v])=>v.area===area).map(([n,v])=>{
      const j=v.pct[M1], s=v.pct[M2];
      let varp=null,estreante=false;
      if(j>0.5) varp=(s-j)/j*100; else estreante=true;
      return {nome:n,cargo:v.cargo,j,s,varp,estreante};
    });
    arr.sort((a,b)=>{
      if(a.estreante&&b.estreante) return b.s-a.s;
      if(a.estreante) return -1; if(b.estreante) return 1;
      return b.varp-a.varp;
    });
    return arr;
  }
  const maxAbs=(()=>{let mx=1;sectorData().forEach(s=>{if(!s.estreante)mx=Math.max(mx,Math.abs(s.varp));});return mx;})();

  function renderSectors(){
    const arr=sectorData();
    document.getElementById('sectorBody').innerHTML='<div class="slist">'+arr.map((s,i)=>{
      const k=s.estreante?'up':clsv(s.varp);
      const w=s.estreante?100:Math.max(5,Math.abs(s.varp)/maxAbs*100);
      const evo=s.estreante?'<span class="estreia">estreou</span>'
        :`<div class="evo ${k}">${fmtVar(s.varp)}<small>jul → set</small></div>`;
      return `<div class="srow ${k} r${i+1}" data-area="${encodeURIComponent(s.nome)}">
        <div class="pos">${i+1}</div>
        <div class="sinfo"><div class="sname">${s.nome}</div>
          <div class="ssub">${s.n} pessoa(s) · ${s.j.toFixed(0)}% → ${s.s.toFixed(0)}% da meta</div></div>
        <div class="track2"><i style="width:${w}%"></i></div>
        ${evo}</div>`;
    }).join('')+'</div>';
    document.querySelectorAll('#sectorBody .srow').forEach(r=>{
      r.addEventListener('click',()=>openSector(decodeURIComponent(r.dataset.area)));
    });
  }
  function openSector(area){
    const ppl=peopleOf(area), body=document.getElementById('sectorBody');
    body.innerHTML=`<button class="back" id="backBtn">‹ voltar aos setores</button>
      <div class="phead">${area} · quem mais evoluiu (jul → set)</div>
      ${ppl.map((p,i)=>{
        const k=p.estreante?'up':clsv(p.varp);
        const evo=p.estreante?'<span class="estreia">estreou</span>':`<div class="pevo ${k}">${fmtVar(p.varp)}</div>`;
        return `<div class="prow"><div class="ppos">${i+1}</div>
          <div class="pname">${p.nome}<small>${p.cargo||''}</small></div>
          <div class="ppct"><span class="a">${p.j.toFixed(0)}%</span> → <b>${p.s.toFixed(0)}%</b></div>
          ${evo}</div>`;
      }).join('')}`;
    document.getElementById('backBtn').addEventListener('click',renderSectors);
    body.scrollTop=0;
  }
  function renderChamp(){
    const arr=sectorData().filter(s=>!s.estreante);
    const [top,p2,p3]=arr;
    const podium=[top,p2,p3].filter(Boolean).map((s,i)=>{
      const med=['🥇','🥈','🥉'][i];
      return `<div class="pod ${i===0?'first':''}"><div class="medal">${med}</div>
        <div class="pn">${s.nome}</div><div class="pv">${fmtVar(s.varp)}</div>
        <div class="pa">${s.j.toFixed(0)}% → ${s.s.toFixed(0)}%</div></div>`;
    }).join('');
    document.getElementById('champBody').innerHTML=`
      <div class="crown">👑</div>
      <div class="cname">${top.nome}</div>
      <div class="cbig">${fmtVar(top.varp)}<small> de crescimento</small></div>
      <div class="cline">O setor <b>${top.nome}</b> saiu de <b>${top.j.toFixed(0)}%</b> da meta em julho para <b>${top.s.toFixed(0)}%</b> agora, a maior evolução do escritório no período.</div>
      <div class="podium">${podium}</div>`;
  }

  // carousel
  const track=document.getElementById('track');
  const slides=[...document.querySelectorAll('.slide')];
  let idx=0;
  const dots=document.getElementById('dots');
  slides.forEach((_,i)=>{const b=document.createElement('button');b.className='d'+(i===0?' on':'');b.addEventListener('click',()=>go(i));dots.appendChild(b);});
  function go(i){
    idx=(i+slides.length)%slides.length;
    track.style.transform=`translateX(-${idx*100}%)`;
    slides.forEach((s,k)=>s.classList.toggle('side',k!==idx));
    document.querySelectorAll('.dots .d').forEach((d,k)=>d.classList.toggle('on',k===idx));
    if(idx===0) renderSectors();
  }
  document.getElementById('next').addEventListener('click',()=>go(idx+1));
  document.getElementById('prev').addEventListener('click',()=>go(idx-1));
  document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(idx+1);if(e.key==='ArrowLeft')go(idx-1);});

  renderSectors(); renderChamp();
  slides.forEach((s,k)=>s.classList.toggle('side',k!==0));
})();
</script>
</body>
</html>
