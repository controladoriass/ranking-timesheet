<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Desempenho no Timesheet · Silva & Silva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#16324f; --navy2:#1d3e5e; --ink:#16324f; --ink2:#5b7488; --ink3:#93a6b6;
  --gold:#c9a227; --gold2:#b8931f;
  --bg:#f4f6f8; --bg2:#eef1f4; --card:#ffffff; --line:#e3e8ee; --line2:#eef2f6;
  --up:#2e9e6b; --up2:#1f8a5a; --down:#d15757; --down2:#b84545; --flat:#8798a6;
  --shadow:0 30px 70px rgba(22,50,79,.16); --shadow-side:0 14px 34px rgba(22,50,79,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:linear-gradient(180deg,#f7f9fb 0%, var(--bg) 100%) fixed;color:var(--ink);font-family:'Montserrat',system-ui,Arial,sans-serif;-webkit-font-smoothing:antialiased;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.stage{flex:1;display:flex;flex-direction:column;width:100%;max-width:1280px;margin:0 auto;padding:clamp(16px,2.5vw,34px) clamp(14px,2.5vw,30px);min-height:0}

.pagehead{text-align:center;margin-bottom:6px}
.pagehead .eyebrow{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px}
.pagehead h1{font-size:clamp(24px,3.6vw,38px);font-weight:800;letter-spacing:-.015em;color:var(--navy)}
.pagehead .rule{width:120px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:16px auto 0}

.carousel{position:relative;flex:1;display:flex;align-items:stretch;justify-content:center;margin-top:18px;min-height:0}
.arw{flex:0 0 auto;align-self:center;width:48px;height:48px;border-radius:12px;background:var(--navy);border:0;color:#fff;font-size:22px;cursor:pointer;display:grid;place-items:center;transition:.18s;box-shadow:0 8px 20px rgba(22,50,79,.22);z-index:5}
.arw:hover{background:#0f2439;transform:translateY(-1px)}
.viewport{flex:1;overflow:hidden;padding:8px clamp(10px,4vw,60px);display:flex;align-items:center;min-height:0}
.track{display:flex;align-items:stretch;transition:transform .5s cubic-bezier(.5,.05,.2,1);width:100%;height:100%}
.slide{flex:0 0 100%;padding:0 14px;display:flex;transition:.5s;opacity:1;min-height:0}
.slide.side{opacity:.4;filter:saturate(.7)}
.slide .card{width:100%}

.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;max-height:100%}
.slide.side .card{box-shadow:var(--shadow-side);transform:scale(.94)}
.card-h{padding:24px 30px 16px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.card-h .htext .eyebrow{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:8px}
.card-h .htext h2{font-size:clamp(18px,2.3vw,25px);font-weight:800;letter-spacing:-.01em;color:var(--navy);line-height:1.1}
.card-h .htext .desc{color:var(--ink3);font-size:12px;margin-top:8px;font-weight:500;line-height:1.5}
.card-h .badge{flex:0 0 auto;text-align:center;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 16px;min-width:96px}
.card-h .badge .bv{font-weight:900;font-size:22px;font-variant-numeric:tabular-nums;line-height:1}
.card-h .badge .bv.up{color:var(--up)} .card-h .badge .bv.down{color:var(--down)} .card-h .badge .bv.flat{color:var(--flat)}
.card-h .badge .bl{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:700;margin-top:4px}
.card-b{padding:6px 22px 26px;overflow-y:auto;flex:1}

/* mini meses inline */
.mmini{display:flex;gap:10px;justify-content:flex-end;font-size:11px;color:var(--ink3);font-weight:500;white-space:nowrap}
.mmini span{background:var(--bg2);border-radius:6px;padding:2px 7px}
.mmini b{color:var(--navy);font-weight:700}

/* sector rows (card principal) */
.slist{display:flex;flex-direction:column}
.srow{display:grid;grid-template-columns:34px 1fr auto 96px 84px 20px;align-items:center;gap:14px;padding:14px 12px;border-bottom:1px solid var(--line2);cursor:pointer;transition:.14s;border-radius:10px}
.srow:last-child{border-bottom:0}
.srow:hover{background:var(--bg2)}
.srow:hover .go{color:var(--gold)}
.srow .pos{font-weight:800;font-size:16px;color:var(--ink3);text-align:center}
.srow.r1 .pos{color:var(--gold)} .srow.r2 .pos{color:#b7a24f} .srow.r3 .pos{color:#c2b06b}
.srow .sinfo .sname{font-weight:700;font-size:15.5px;color:var(--navy)}
.srow .sinfo .ssub{font-size:11.5px;color:var(--ink3);margin-top:3px;font-weight:500}
.srow .track2{height:7px;background:var(--bg2);border-radius:5px;overflow:hidden}
.srow .track2 i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--gold2),var(--gold))}
.srow.down .track2 i{background:linear-gradient(90deg,#c96b6b,#d15757)}
.srow .evo{text-align:right;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.srow .evo small{font-size:9.5px;font-weight:600;color:var(--ink3);display:block;margin-top:1px}
.srow .evo.up{color:var(--up)} .srow .evo.down{color:var(--down)} .srow .evo.flat{color:var(--flat)}
.srow .estreia{font-size:10px;font-weight:700;color:var(--gold2);background:rgba(201,162,39,.1);border:1px solid rgba(201,162,39,.3);border-radius:20px;padding:3px 10px;display:inline-block}
.srow .go{color:var(--ink3);font-size:18px;text-align:center;transition:.14s}

/* people rows (cards de setor) */
.prow{display:grid;grid-template-columns:32px 1fr auto auto;align-items:center;gap:12px;padding:12px 12px;border-bottom:1px solid var(--line2)}
.prow:last-child{border-bottom:0}
.prow.r1,.prow.r2,.prow.r3{background:linear-gradient(90deg,rgba(201,162,39,.05),transparent)}
.prow .ppos{font-weight:800;color:var(--ink3);font-size:14px;text-align:center}
.prow.r1 .ppos{color:var(--gold)} .prow.r2 .ppos{color:#b7a24f} .prow.r3 .ppos{color:#c2b06b}
.prow .pname{font-weight:600;font-size:14px;color:var(--navy)}
.prow .pname small{display:block;color:var(--ink3);font-weight:500;font-size:11px;margin-top:1px}
.prow .ppct{font-size:12px;color:var(--ink2);font-weight:500;white-space:nowrap}
.prow .ppct .a{color:var(--ink3)} .prow .ppct b{color:var(--navy);font-weight:700}
.prow .pevo{min-width:62px;text-align:right;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.prow .pevo.up{color:var(--up)} .prow .pevo.down{color:var(--down)} .prow .pevo.flat{color:var(--flat)}
.prow .estreia{font-size:10px;font-weight:700;color:var(--gold2);background:rgba(201,162,39,.1);border:1px solid rgba(201,162,39,.3);border-radius:20px;padding:3px 9px}
.emptyp{color:var(--ink3);font-size:13px;text-align:center;padding:40px 10px;font-weight:500}
.prow{cursor:pointer;grid-template-columns:32px 1fr auto 78px !important}
.prow:hover{background:var(--bg2)}
.prow .pevo small{display:block;font-size:9px;font-weight:600;color:var(--ink3);margin-top:1px;letter-spacing:.03em;text-align:right}
/* status pill atual da pessoa */
.spill{font-size:9.5px;font-weight:800;letter-spacing:.03em;padding:3px 8px;border-radius:20px;white-space:nowrap;text-transform:uppercase}
.spill.insuf{background:rgba(209,87,87,.12);color:#c0413f;border:1px solid rgba(209,87,87,.3)}
.spill.adeq{background:rgba(46,158,107,.12);color:#1f8a5a;border:1px solid rgba(46,158,107,.3)}
.spill.estend{background:rgba(46,158,107,.16);color:#157a4c;border:1px solid rgba(46,158,107,.4)}
.spill.exced{background:rgba(201,162,39,.14);color:#a17d15;border:1px solid rgba(201,162,39,.4)}
.spill.zero{background:var(--bg2);color:var(--ink3);border:1px solid var(--line)}
.prow{grid-template-columns:32px 1fr auto auto auto}

/* legenda fixa rodapé do card (centralizada) */
.legend{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 24px;border-top:1px solid var(--line2);background:var(--bg)}
.legend .lgrow{display:flex;flex-wrap:wrap;gap:10px 20px;justify-content:center}
.legend .lg{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--ink2);font-weight:500}
.legend .lg .dot{width:9px;height:9px;border-radius:50%}
.legend .lg b{color:var(--navy);font-weight:700}
.legend .lg span{color:var(--ink3);font-size:10px}
.legend .lgnote{font-size:10px;color:var(--ink3);text-align:center}

/* painel resumo da pessoa (semana a semana) */
.pdetail{position:fixed;inset:0;background:rgba(16,36,57,.5);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.pdetail.open{display:flex}
.pdbox{background:#fff;border-radius:20px;max-width:640px;width:100%;max-height:86vh;overflow:hidden;box-shadow:0 40px 90px rgba(16,36,57,.4);display:flex;flex-direction:column}
.pdhead{padding:22px 26px 18px;border-bottom:1px solid var(--line2);display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.pdhead .pname2{font-size:20px;font-weight:800;color:var(--navy)}
.pdhead .psub2{font-size:12px;color:var(--ink3);margin-top:4px;font-weight:500}
.pdhead .pclose{background:var(--bg);border:1px solid var(--line);width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:18px;color:var(--ink2);flex:0 0 auto}
.pdhead .pclose:hover{color:var(--navy);border-color:var(--gold)}
.pdmonths{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:16px 26px 6px}
.pmon{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.pmon .mn{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:700}
.pmon .mp{font-size:22px;font-weight:900;color:var(--navy);font-variant-numeric:tabular-nums;margin-top:3px}
.pmon .mh{font-size:11px;color:var(--ink3);font-weight:600;margin-top:2px}
.pdweeks{padding:16px 26px 24px;overflow-y:auto}
.pdweeks .wt{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);font-weight:700;margin:4px 0 6px}
.pdweeks .wtsub{font-size:11px;color:var(--ink3);font-weight:500;margin-bottom:16px}
/* gráfico de colunas semanais */
.chart{position:relative;display:flex;align-items:flex-end;gap:6px;height:190px;padding:22px 0 0;border-bottom:2px solid var(--line);margin-bottom:6px}
.chart .goal{position:absolute;left:0;right:0;border-top:2px dashed #9fb3c4;z-index:1}
.chart .goal .gl{position:absolute;right:0;top:-8px;font-size:9px;color:#7a90a2;background:#fff;padding:0 4px;font-weight:700}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:0;position:relative;min-width:0}
.col .barwrap{width:100%;display:flex;align-items:flex-end;justify-content:center;flex:1}
.col .bar{width:76%;max-width:26px;border-radius:5px 5px 0 0;transition:.3s;min-height:2px}
.col .bar.hit{background:linear-gradient(180deg,#3fb37f,#2e9e6b)}
.col .bar.miss{background:linear-gradient(180deg,#e58585,#d15757)}
.col .bar.zero{background:#d7dee5}
.col .cpct{font-size:9.5px;font-weight:800;margin-bottom:3px;font-variant-numeric:tabular-nums}
.col .cpct.hit{color:#2e9e6b} .col .cpct.miss{color:#d15757} .col .cpct.zero{color:var(--ink3)}
.chart-x{display:flex;gap:6px;margin-top:6px}
.chart-x .xl{flex:1;text-align:center;font-size:8.5px;color:var(--ink3);font-weight:600;line-height:1.3;min-width:0}
/* detalhe horas por semana (lista abaixo do gráfico) */
.wkhours{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:6px 18px}
.wkh{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;padding:5px 0;border-bottom:1px solid var(--line2)}
.wkh .wkl{color:var(--ink2);font-weight:600}
.wkh .wkv{font-weight:700;font-variant-numeric:tabular-nums}
.wkh .wkv.hit{color:#2e9e6b} .wkh .wkv.miss{color:#d15757} .wkh .wkv.zero{color:var(--ink3)}
.wklegend{display:flex;gap:16px;justify-content:center;margin-top:14px;font-size:11px;color:var(--ink2)}
.wklegend span{display:flex;align-items:center;gap:6px}
.wklegend i{width:11px;height:11px;border-radius:3px;display:inline-block}
@media(max-width:560px){
  .col .cpct{font-size:8px}
  .chart-x .xl{font-size:7px}
  .wkhours{grid-template-columns:1fr}
}

/* dots */
.dots{display:flex;gap:7px;justify-content:center;margin-top:20px;flex-wrap:wrap;max-width:900px;margin-left:auto;margin-right:auto}
.dots .d{width:9px;height:9px;border-radius:50%;background:var(--line);cursor:pointer;transition:.16s;border:0;padding:0}
.dots .d.on{background:var(--gold);width:26px;border-radius:6px}
.dots .d.principal.on{background:var(--navy)}

@media(max-width:720px){
  .viewport{padding:14px 4px}
  .slide{padding:0 6px}
  .arw{width:40px;height:40px;font-size:18px}
  .card-h{flex-direction:column}
  .card-h .badge{align-self:flex-start}
  .srow{grid-template-columns:30px 1fr 82px 18px;gap:10px}
  .srow .track2{display:none}
  .prow{grid-template-columns:26px 1fr auto}
  .prow .ppct{display:none}
}
</style>
</head>
<body>
<div class="stage">

  <div class="carousel">
    <button class="arw" id="prev" aria-label="anterior">‹</button>
    <div class="viewport">
      <div class="track" id="track"></div>
    </div>
    <button class="arw" id="next" aria-label="próximo">›</button>
  </div>

  <div class="dots" id="dots"></div>

</div>

<!-- modal resumo da pessoa -->
<div class="pdetail" id="pdetail">
  <div class="pdbox">
    <div class="pdhead">
      <div>
        <div class="pname2" id="pd_name"></div>
        <div class="psub2" id="pd_sub"></div>
      </div>
      <button class="pclose" id="pd_close">✕</button>
    </div>
    <div class="pdmonths" id="pd_months"></div>
    <div class="pdweeks" id="pd_weeks"></div>
  </div>
</div>

<script src="dados.js"></script>
<script>
(function(){
  const D = window.TIMESHEET_DATA;
  const MESES3 = ['Julho','Agosto','Setembro'];
  const fmtPct = v => Math.round(v)+'%';
  // média dos 3 meses = desempenho médio
  function mediaDe(pct){ return (pct.Julho+pct.Agosto+pct.Setembro)/3; }

  // status pela régua (% já é sobre a meta individual, cortes iguais p/ todos)
  function statusOf(p){
    if(p<=0) return {k:'zero', t:'sem reg.'};
    if(p>=128.58) return {k:'exced', t:'Excedente'};
    if(p>=107.15) return {k:'estend', t:'Estendido'};
    if(p>=97.5) return {k:'adeq', t:'Adequado'};
    return {k:'insuf', t:'Insuficiente'};
  }
  function statusColor(k){
    return {insuf:'#d15757',adeq:'#2e9e6b',estend:'#157a4c',exced:'#c9a227',zero:'#c3cdd6'}[k]||'#c3cdd6';
  }
  const LEGEND = `<div class="legend">
    <div class="lgrow">
      <div class="lg"><span class="dot" style="background:#d15757"></span><b>Insuficiente</b><span>&lt;97,5%</span></div>
      <div class="lg"><span class="dot" style="background:#2e9e6b"></span><b>Adequado</b><span>97,5–107%</span></div>
      <div class="lg"><span class="dot" style="background:#157a4c"></span><b>Estendido</b><span>107–128%</span></div>
      <div class="lg"><span class="dot" style="background:#c9a227"></span><b>Excedente</b><span>&gt;128,6%</span></div>
    </div>
    <div class="lgnote">média dos 3 meses (jul·ago·set) do % da meta individual · adv. 7h/dia · estag. 5h/dia</div>
  </div>`;

  function sectorData(){
    let arr=[];
    for(const [nome,v] of Object.entries(D.setores)){
      if((v.Julho+v.Agosto+v.Setembro)===0) continue;
      const med=mediaDe(v);
      arr.push({nome,n:v.n,jul:v.Julho,ago:v.Agosto,set:v.Setembro,media:med});
    }
    arr.sort((a,b)=> b.media-a.media);
    return arr;
  }
  function peopleOf(area){
    let arr=Object.entries(D.colaboradores).filter(([n,v])=>v.area===area).map(([n,v])=>{
      const med=mediaDe(v.pct);
      return {nome:n,cargo:v.cargo,jul:v.pct.Julho,ago:v.pct.Agosto,set:v.pct.Setembro,media:med};
    });
    arr.sort((a,b)=> b.media-a.media);
    return arr;
  }

  const SECTORS = sectorData();
  const maxMedia=Math.max(100,...SECTORS.map(s=>s.media));

  // ---- montar slides: [principal] + [um por setor] ----
  const track=document.getElementById('track');
  const slidesMeta=[{type:'principal'}].concat(SECTORS.map(s=>({type:'setor',area:s.nome})));

  function mesesInline(jul,ago,set){
    return `<div class="mmini">
      <span>J <b>${jul.toFixed(0)}</b></span>
      <span>A <b>${ago.toFixed(0)}</b></span>
      <span>S <b>${set.toFixed(0)}*</b></span>
    </div>`;
  }
  function principalHTML(){
    const rows=SECTORS.map((s,i)=>{
      const st=statusOf(s.media);
      const w=Math.max(5,s.media/maxMedia*100);
      return `<div class="srow r${i+1}" data-idx="${i+1}">
        <div class="pos">${i+1}</div>
        <div class="sinfo"><div class="sname">${s.nome}</div>
          <div class="ssub">${s.n} pessoa(s) · média dos 3 meses</div></div>
        ${mesesInline(s.jul,s.ago,s.set)}
        <div class="track2"><i style="width:${w}%;background:linear-gradient(90deg,${statusColor(st.k)}bb,${statusColor(st.k)})"></i></div>
        <div class="evo" style="color:${statusColor(st.k)}">${fmtPct(s.media)}<small>média</small></div>
        <div class="go">›</div>
      </div>`;
    }).join('');
    return `<div class="card">
      <div class="card-h"><div class="htext">
        <div class="eyebrow">Card principal · por setor</div>
        <h2>Desempenho médio por setor</h2>
        <div class="desc">Média do % da meta nos 3 meses (jul · ago · set, até 13/09). Clique num setor para abrir o card dele.</div>
      </div></div>
      <div class="card-b"><div class="slist">${rows}</div></div>
      ${LEGEND}
    </div>`;
  }

  function setorHTML(area){
    const s=SECTORS.find(x=>x.nome===area);
    const ppl=peopleOf(area);
    const bst=statusOf(s.media);
    const badge=`<div class="bv" style="color:${statusColor(bst.k)}">${fmtPct(s.media)}</div><div class="bl">média 3 meses</div>`;
    const rows = ppl.length ? ppl.map((p,i)=>{
      const st=statusOf(p.media); // status pela MÉDIA dos 3 meses
      return `<div class="prow r${i+1}" data-nome="${encodeURIComponent(p.nome)}"><div class="ppos">${i+1}</div>
        <div class="pname">${p.nome}<small>${p.cargo||''}</small></div>
        <span class="spill ${st.k}">${st.t}</span>
        <div class="pevo" style="color:${statusColor(st.k)}">${fmtPct(p.media)}<small>média</small></div></div>`;
    }).join('') : '<div class="emptyp">Sem colaboradores com registro neste setor.</div>';
    return `<div class="card">
      <div class="card-h">
        <div class="htext">
          <div class="eyebrow">Setor</div>
          <h2>${area}</h2>
          <div class="desc">Desempenho médio (jul · ago · set) · ${s.n} pessoa(s) · clique numa pessoa para ver semana a semana</div>
        </div>
        <div class="badge">${badge}</div>
      </div>
      <div class="card-b">${rows}</div>
      ${LEGEND}
    </div>`;
  }

  // render slides
  track.innerHTML = slidesMeta.map(m=>{
    const inner = m.type==='principal' ? principalHTML() : setorHTML(m.area);
    return `<div class="slide">${inner}</div>`;
  }).join('');
  const slides=[...document.querySelectorAll('.slide')];

  // dots
  const dots=document.getElementById('dots');
  slidesMeta.forEach((m,i)=>{
    const b=document.createElement('button');
    b.className='d'+(i===0?' principal on':'')+(m.type==='principal'?' principal':'');
    b.title = m.type==='principal'?'Setor que mais evoluiu':m.area;
    b.addEventListener('click',()=>go(i));
    dots.appendChild(b);
  });

  let idx=0;
  function go(i){
    idx=(i+slides.length)%slides.length;
    track.style.transform=`translateX(-${idx*100}%)`;
    slides.forEach((s,k)=>s.classList.toggle('side',k!==idx));
    document.querySelectorAll('.dots .d').forEach((d,k)=>d.classList.toggle('on',k===idx));
  }
  document.getElementById('next').addEventListener('click',()=>go(idx+1));
  document.getElementById('prev').addEventListener('click',()=>go(idx-1));
  document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(idx+1);if(e.key==='ArrowLeft')go(idx-1);});

  // clique num setor do card principal -> vai pro card daquele setor
  document.querySelectorAll('.srow').forEach(r=>{
    r.addEventListener('click',()=>go(parseInt(r.dataset.idx,10)));
  });

  // clique numa PESSOA -> modal resumo semana a semana
  const modal=document.getElementById('pdetail');
  function openPerson(nome){
    const v=D.colaboradores[nome]; if(!v) return;
    const labels=D.semanas.labels;
    const horasSem=(D.semanas.horas&&D.semanas.horas[nome])||[];
    const duSem=D.semanas.dias_uteis||[];
    const meta=v.meta;
    document.getElementById('pd_name').textContent=nome;
    document.getElementById('pd_sub').textContent=`${v.area} · ${v.cargo||''} · meta ${meta}h/dia`;
    // meses (mantém o resumo dos 3 meses no topo)
    document.getElementById('pd_months').innerHTML=['Julho','Agosto','Setembro'].map(mn=>{
      const p=v.pct[mn], h=v.horas[mn], st=statusOf(p);
      return `<div class="pmon"><div class="mn">${mn}${mn==='Setembro'?' *':''}</div>
        <div class="mp" style="color:${statusColor(st.k)}">${p.toFixed(0)}%</div>
        <div class="mh">${h.toFixed(0)}h · ${st.t}</div></div>`;
    }).join('');

    // === GRÁFICO DE COLUNAS SEMANAIS (bateu = verde / não bateu = vermelho) ===
    // meta esperada da semana = meta/dia × dias úteis daquela semana
    const semanas=labels.map((lab,i)=>{
      const feito=horasSem[i]||0;
      const esperado=meta*(duSem[i]||0);
      const pct=esperado>0? feito/esperado*100 : 0;
      const bateu=pct>=97.5;
      const cls=feito<=0?'zero':(bateu?'hit':'miss');
      return {lab, feito, esperado, pct, cls};
    });
    const maxPct=Math.max(120,...semanas.map(s=>s.pct)); // teto do gráfico
    const goalTop=(1-100/maxPct)*100; // posição da linha de meta (100%)
    const cols=semanas.map(s=>{
      const h=s.pct<=0?0:Math.min(s.pct,maxPct)/maxPct*100;
      const pctTxt=s.feito<=0?'–':Math.round(s.pct)+'%';
      return `<div class="col">
        <div class="cpct ${s.cls}">${pctTxt}</div>
        <div class="barwrap"><div class="bar ${s.cls}" style="height:${h}%"></div></div>
      </div>`;
    }).join('');
    const xlabels=semanas.map(s=>`<div class="xl">${s.lab}</div>`).join('');
    // lista de horas feito/esperado por semana
    const lista=semanas.map(s=>{
      const v2=s.feito<=0?`<span class="wkv zero">0h de ${s.esperado.toFixed(0)}h</span>`
        :`<span class="wkv ${s.cls}">${s.feito.toFixed(0)}h de ${s.esperado.toFixed(0)}h</span>`;
      return `<div class="wkh"><span class="wkl">${s.lab}</span>${v2}</div>`;
    }).join('');

    document.getElementById('pd_weeks').innerHTML=`
      <div class="wt">Evolução semana a semana</div>
      <div class="wtsub">Bateu a meta de horas da semana? Verde = bateu (≥97,5%) · vermelho = ficou abaixo. Meta da semana = ${meta}h/dia × dias úteis. (* setembro parcial, até 13/09)</div>
      <div class="chart">
        <div class="goal" style="top:${goalTop}%"><span class="gl">meta 100%</span></div>
        ${cols}
      </div>
      <div class="chart-x">${xlabels}</div>
      <div class="wkhours">${lista}</div>
      <div class="wklegend">
        <span><i style="background:#2e9e6b"></i> bateu a meta</span>
        <span><i style="background:#d15757"></i> abaixo da meta</span>
        <span><i style="background:#d7dee5"></i> sem registro</span>
      </div>`;
    modal.classList.add('open');
    document.querySelector('.pdweeks').scrollTop=0;
  }
  function bindPeople(){
    document.querySelectorAll('.prow[data-nome]').forEach(r=>{
      r.onclick=()=>openPerson(decodeURIComponent(r.dataset.nome));
    });
  }
  bindPeople();
  document.getElementById('pd_close').addEventListener('click',()=>modal.classList.remove('open'));
  modal.addEventListener('click',e=>{ if(e.target===modal) modal.classList.remove('open'); });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') modal.classList.remove('open'); });

  slides.forEach((s,k)=>s.classList.toggle('side',k!==0));
})();
</script>
</body>
</html>
